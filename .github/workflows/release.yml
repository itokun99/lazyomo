name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Asset naming contract (shared with scripts/install.js and Formula/lazyomo.rb):
      # lazyomo-darwin-amd64, lazyomo-darwin-arm64, lazyomo-linux-amd64,
      # lazyomo-linux-arm64, lazyomo-windows-amd64.exe, lazyomo-windows-arm64.exe
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          asset="lazyomo-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            asset="${asset}.exe"
          fi
          go build -o "dist/${asset}" ./cmd/lazyomo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazyomo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
